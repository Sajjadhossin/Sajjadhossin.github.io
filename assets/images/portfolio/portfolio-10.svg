<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42e695"/>
      <stop offset="1" stop-color="#3bb2b8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- network nodes -->
  <g stroke="#42e695" stroke-width="1.2" opacity="0.35">
    <line x1="90" y1="90" x2="200" y2="150"/>
    <line x1="200" y1="150" x2="140" y2="260"/>
    <line x1="200" y1="150" x2="330" y2="110"/>
    <line x1="330" y1="110" x2="470" y2="170"/>
    <line x1="470" y1="170" x2="420" y2="290"/>
    <line x1="140" y1="260" x2="420" y2="290"/>
  </g>
  <g fill="#42e695" opacity="0.85">
    <circle cx="90" cy="90" r="6"/><circle cx="200" cy="150" r="8"/>
    <circle cx="140" cy="260" r="6"/><circle cx="330" cy="110" r="7"/>
    <circle cx="470" cy="170" r="6"/><circle cx="420" cy="290" r="7"/>
  </g>
  <text x="50" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">Bangladesh</text>
  <text x="50" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="url(#accent)">Startup Summit</text>
  <text x="52" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#bcd4d8">Networking platform for startups &amp; investors</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f2027">
    <rect x="50" y="320" width="90" height="26" rx="13" fill="#42e695"/><text x="62" y="337">Laravel</text>
    <rect x="150" y="320" width="70" height="26" rx="13" fill="#42e695"/><text x="163" y="337">Vue.js</text>
    <rect x="230" y="320" width="110" height="26" rx="13" fill="#42e695"/><text x="243" y="337">Tailwind CSS</text>
  </g>
</svg>